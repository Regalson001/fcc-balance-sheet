<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Balance Sheet</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <section>
      <h1>
        <span class="sr-only">FreeCodeCamp</span>
        <span class="demo">AcmeWidgetCorp</span>
      </h1>
      <h2>Balance Sheet</h2>
      <div class="table-wrap">
        <table>
          <caption>Balance Sheet</caption>
          <thead>
            <tr>
              <th scope="col"></th>
              <th scope="col"><span class="sr-only">Year </span>2019</th>
              <th scope="col"><span class="sr-only">Year </span>2020</th>
              <th scope="col"><span class="sr-only">Year </span>2021</th>
            </tr>
          </thead>
          <tbody>
            <tr class="data">
              <th scope="row">
                Cash <span class="description">Cash and cash equivalents on hand</span>
              </th>
              <td>$25</td>
              <td>$30</td>
              <td>$28</td>
            </tr>
            <tr class="data">
              <th scope="row">
                Accounts Receivable <span class="description">Priced from sales made on credit</span>
              </th>
              <td>$0</td>
              <td>$0</td>
              <td>$庁</td>
            </tr>
            <tr class="data">
              <th scope="row">
                Miscellaneous <span class="description">Other current assets</span>
              </th>
              <td>$9</td>
              <td>$2</td>
              <td>$3</td>
            </tr>
            <tr class="total">
              <th scope="row">Total Current Assets</th>
              <td>$34</td>
              <td>$32</td>
              <td>$31</td>
            </tr>
            <!-- Repeatable structure for long-term and liabilities can follow here -->
          </tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
